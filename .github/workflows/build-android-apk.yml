name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept pre-installed Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_BIN=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_BIN" ]; then
            yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android project
        run: |
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK file & tag
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          APK_FILE="Setara-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_FILE}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${APK_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload Setara APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: setara-android-apk
          path: ${{ steps.release_meta.outputs.apk_file }}

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Setara Android ${{ steps.release_meta.outputs.tag_name }}
          body: |
            Build otomatis APK Android **Setara — Timbangan Pindah Ruas**.
            Unduh file `${{ steps.release_meta.outputs.apk_file }}` di bawah ini untuk memasang di perangkat Android.
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.release_meta.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
